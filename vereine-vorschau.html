<title>doBasket Vereine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@400;600;700&display=swap">
<style>
/* Tokens 1:1 aus kalender.html (dobasket-Markenpalette). */
:root{
  --ground:#f8f8f6; --surface:#ffffff; --sunken:#eef1ef;
  --ink:#1f1f1f; --ink-2:#3a4650; --muted:#6a7480; --line:#e4e7e4; --line-2:#d2d7d3;
  --accent:#ef5a00; --accent-weich:#ffe7db; --accent-ink:#b8420a;
  --gruen:#39b54a; --orange:#f47b20;
  --herren:#2b3a44; --damen:#007fa3;
  --u18:#2f7a3f; --u16:#39b54a; --u14:#66c07a; --u12:#9bd8a8;
  --schatten:0 1px 2px rgba(31,31,31,.06), 0 8px 24px -12px rgba(31,31,31,.18);
  --r:10px;
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-eng:"Archivo Narrow","Archivo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#14181b; --surface:#1d2226; --sunken:#262c31;
    --ink:#f1f2ef; --ink-2:#c6ccd0; --muted:#8b959c; --line:#2c343a; --line-2:#3b444b;
    --accent:#ff7d3f; --accent-weich:#3a1f10; --accent-ink:#ffb184;
    --gruen:#5cc274; --orange:#ff9247;
    --herren:#8aa0ad; --damen:#35a9cc;
    --u18:#4aa564; --u16:#5cc274; --u14:#86d597; --u12:#b0e3bd;
    --schatten:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#14181b; --surface:#1d2226; --sunken:#262c31;
  --ink:#f1f2ef; --ink-2:#c6ccd0; --muted:#8b959c; --line:#2c343a; --line-2:#3b444b;
  --accent:#ff7d3f; --accent-weich:#3a1f10; --accent-ink:#ffb184;
  --gruen:#5cc274; --orange:#ff9247;
  --herren:#8aa0ad; --damen:#35a9cc;
  --u18:#4aa564; --u16:#5cc274; --u14:#86d597; --u12:#b0e3bd;
  --schatten:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button,select{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--accent-ink);text-decoration:none;font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* --- Kopf --- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px}
.zurueck{display:inline-flex;align-items:center;gap:11px;color:var(--ink)}
/* Wortmarke wie im Kalender: schwarzer Schrift-/Ball-Pfad folgt der Theme-Textfarbe,
   die orange Kontur behaelt ihre Farbe. */
.zurueck .marke-logo{height:44px;width:auto;display:block}
.zurueck .marke-logo path[fill="#151616"]{fill:var(--ink)}
.zurueck .arrow{font-family:var(--f-display);color:var(--muted);font-weight:700;font-size:14px;letter-spacing:-.01em}
@media (max-width:520px){ .zurueck .arrow{display:none} .zurueck .marke-logo{height:38px} }
.thema-knopf{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
  border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  font-size:16px;line-height:1;box-shadow:var(--schatten);transition:.12s}
.thema-knopf:hover{background:var(--sunken);color:var(--ink);border-color:var(--accent)}

.welle{display:block;width:100%;height:3px;border:none;border-radius:2px;background:var(--accent)}

/* --- Hero (Vereinskopf) --- */
.hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.crest{width:84px;height:84px;border-radius:18px;flex-shrink:0;display:grid;place-items:center;
  font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--orange));box-shadow:var(--schatten)}
.hero-txt{min-width:0;flex:1}
.hero-name{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4.4vw,42px);
  letter-spacing:-.02em;line-height:1.02}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:10px;
  font-size:13px;color:var(--muted)}
.hero-meta b{color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.hero-meta .platz{color:var(--muted);font-weight:600}
.hero-wahl{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.hero-wahl label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero-wahl select{border:1px solid var(--line-2);padding:9px 12px;border-radius:8px;
  background:var(--surface);color:var(--ink);min-width:210px;font-weight:600}

/* --- Abschnitt --- */
.abschnitt{display:flex;flex-direction:column;gap:12px}
.abschnitt-kopf{display:flex;align-items:baseline;gap:10px}
.abschnitt-kopf h2{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.02em;
  text-transform:uppercase}
.abschnitt-kopf span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* --- Team-Karten --- */
.gruppe-titel{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin:4px 0 2px}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.team-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--schatten);padding:14px 15px;display:flex;flex-direction:column;gap:9px;
  border-left:4px solid var(--pk,var(--muted))}
.team-card .tc-liga{display:flex;align-items:center;gap:8px}
.team-card .punkt{width:10px;height:10px;border-radius:50%;background:var(--pk,var(--muted));flex-shrink:0}
.team-card .tc-name{font-weight:700;font-size:15px;color:var(--ink)}
.team-card .tc-sub{font-size:12.5px;color:var(--muted)}
.team-card .tc-tab{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);
  border-top:1px solid var(--line);padding-top:9px;font-variant-numeric:tabular-nums}
.team-card .tc-tab .k{color:var(--muted)}
.team-card .tc-tab b{color:var(--ink);font-weight:800}
.team-card .tc-tab.leer{color:var(--muted);font-style:italic}
.tc-platz{margin-left:auto;font-family:var(--f-eng);font-weight:800;font-size:14px;
  color:var(--pk,var(--ink-2));font-variant-numeric:tabular-nums}

/* --- Widgets (Zeilen 1:1 aus kalender.html) --- */
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){ .widgets{grid-template-columns:1fr} }
.widget{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--schatten);overflow:hidden;display:flex;flex-direction:column}
.widget-kopf{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:13px 16px;border-bottom:1px solid var(--line)}
.widget-kopf h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.widget-kopf span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.widget-liste{display:flex;flex-direction:column}
.wz{display:grid;grid-template-columns:3px 36px 56px 1fr auto;align-items:center;gap:11px;
  padding:11px 16px;text-align:left;width:100%;border-top:1px solid var(--line)}
.wz:first-child{border-top:none}
.wz-rail{width:3px;align-self:stretch;min-height:32px;border-radius:2px;background:var(--pk,var(--muted))}
.wz-tag{font-family:var(--f-eng);font-size:12px;font-weight:600;color:var(--muted);text-align:center;line-height:1.1}
.wz-tag b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.wz-zeit{font-family:var(--f-eng);font-weight:700;font-variant-numeric:tabular-nums;font-size:15.5px}
.wz-zeit.offen{font-size:12px;color:var(--muted);font-weight:400}
.wz-paar{font-size:14.5px;min-width:0}
.wz-paar>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wz-paar small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12.5px}
.wz-liga{font-family:var(--f-eng);font-weight:700;color:var(--pk,var(--ink-2))}
.wz-erg{font-family:var(--f-eng);font-weight:800;font-variant-numeric:tabular-nums;font-size:18px}
.tn.sieger{font-weight:800;color:var(--ink)}
.tn.verlierer{color:var(--muted)}
.widget-leer{padding:26px 16px;text-align:center;color:var(--muted);font-size:13.5px}

/* Rot fuer "Ausgeschieden" -- eigenes Token, in beiden Themes lesbar. */
:root{--rot:#c62828}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--rot:#ff7b7b} }
:root[data-theme="dark"]{--rot:#ff7b7b}

.team-card{cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .06s}
.team-card:hover{border-color:var(--accent);border-left-color:var(--pk,var(--accent))}
.team-card:active{transform:translateY(1px)}
.team-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tc-status-aus{color:var(--rot);font-weight:800}

/* Mannschafts-Detail (Klick auf eine Karte) */
.td{background:var(--sunken);border:1px solid var(--line-2);border-radius:var(--r);padding:18px}
.td-kopf{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.td-back{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:11.5px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink)}
.td-titel{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.td-liga{color:var(--muted);font-weight:700;font-size:15px}
.td-grid{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media (max-width:820px){ .td-grid{grid-template-columns:1fr} }
.td-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}

.tabelle{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;font-size:13px}
.tabelle th{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);font-weight:700}
.tabelle th.l,.tabelle td.l{text-align:left}
.tabelle td{padding:8px;border-top:1px solid var(--line);text-align:right;
  font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tabelle td.l{color:var(--ink)}
.tabelle td.rang{color:var(--muted)}
.tabelle tr.ich td{background:var(--accent-weich);color:var(--ink);font-weight:800}
.tabelle .tlink{color:var(--accent-ink);font-weight:700;cursor:pointer;
  text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:2px}
.tabelle .tlink:hover{text-decoration-color:var(--accent)}
.tabelle tr.ich .tlink{color:inherit}
.tabelle .tlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.tab-hinweis{padding:8px 2px 0;font-size:12px;color:var(--muted)}

.pfad{display:flex;flex-direction:column;gap:9px}
.pfad-runde{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pk,var(--accent));
  border-radius:var(--r);padding:11px 13px}
.pfad-runde.aus{border-left-color:var(--rot)}
.pfad-runde .r-kopf{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-bottom:4px}
.pfad-runde .r-paar{font-size:14.5px}
.pfad-runde .r-erg{font-family:var(--f-eng);font-weight:800;font-variant-numeric:tabular-nums}
.pfad-runde .aus-text{margin-top:5px;color:var(--rot);font-weight:800;font-size:12.5px}

.fuss{font-size:12px;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:16px}
</style>

  var w={}; p.forEach(function(t){w[t.type]=t.value;}); return w.year+"-"+w.month+"-"+w.day;
}
var HEUTE=heuteBerlin();
function zeitschluessel(s){ return s.d+"T"+(s.t||"99:99"); }

// --- Farben/Labels (1:1 aus dem Kalender) ---
var FARBEN={"Herren":"var(--herren)","Damen":"var(--damen)","U18":"var(--u18)","U16":"var(--u16)","U14":"var(--u14)","U12":"var(--u12)"};
function farbGruppe(a){ var m=/^U\d+/.exec(a||""); return m?m[0]:a; }
function farbe(lk){ var l=D.ligen[lk]; return l?(FARBEN[farbGruppe(l.alter)]||"var(--muted)"):"var(--muted)"; }
function alterLang(li){ if(li.alter==="?")return""; var m=/^U(\d+)/.exec(li.alter);
  if(!m)return li.alter; return "U"+m[1]+(li.geschlecht?" "+li.geschlecht:""); }
function ligaLabel(li){ var mKL=/^KL(\d+)$/.exec(li.ebene);
  var stufe=mKL?mKL[1]+". Kreisliga":li.ebene==="PK"?(li.jugend?"Jugendpokal":"WBV Pokal"):li.ebene_lang;
  var alt=alterLang(li); return alt?stufe+" "+alt:stufe; }
function ligaChip(li){ var mKL=/^KL(\d+)$/.exec(li.ebene);
  var kurz=mKL?"KL"+mKL[1]:(li.ebene||"").replace(/[0-9]/g,""); var alt=li.alter==="?"?"":li.alter;
  return alt?alt+" "+kurz:kurz; }
var _LVL={RL:0,OL:1,LL:2,BL:3,KL:4,PK:5}, _ALT={Herren:0,Damen:1,U18:2,U16:3,U14:4,U12:5}, _GES={"männlich":0,"weiblich":1,"offen":2,"":0};
function sortkeyLiga(li){ var grp=farbGruppe(li.alter); var jug=/^U/.test(grp)?1:0;
  var ag=_ALT[grp]; if(ag===undefined)ag=0; var letters=(li.ebene||"").replace(/[0-9]/g,"");
  var num=parseInt((li.ebene||"").replace(/[^0-9]/g,""),10)||0; var lv=_LVL[letters]; if(lv===undefined)lv=8;
  var klnum=letters==="KL"?num:0; var ges=_GES[li.geschlecht||""]; if(ges===undefined)ges=3;
  return [jug,lv,klnum,ag,ges]; }

function mk(tag,kl,txt){ var n=document.createElement(tag); if(kl)n.className=kl; if(txt!=null)n.textContent=txt; return n; }
function leer(n){ while(n.firstChild)n.removeChild(n.firstChild); return n; }
function ergText(s){ return s.e?s.e[0]+":"+s.e[1]:(s.st==="Abgesagt"?"abges.":""); }

// Team-Knoten mit Sieger-Hervorhebung (wie kalender.html)
function teamKnoten(s){
  var w=mk("span"); var hs=mk("span","tn",s.h), gs=mk("span","tn",s.g);
  if(s.e && s.e[0]!==s.e[1]){ var heim=s.e[0]>s.e[1];
    (heim?hs:gs).classList.add("sieger"); (heim?gs:hs).classList.add("verlierer"); }
  w.appendChild(hs); w.appendChild(document.createTextNode(" – ")); w.appendChild(gs); return w;
}
function widgetZeile(s){
  var b=mk("div","wz"); b.style.setProperty("--pk",farbe(s.lk));
  b.appendChild(mk("span","wz-rail"));
  var tg=mk("span","wz-tag"); tg.appendChild(mk("b",null,String(s2d(s.d).getUTCDate())));
  tg.appendChild(document.createTextNode(WT[wtag(s.d)])); b.appendChild(tg);
  var zt=mk("span","wz-zeit"+(s.t?"":" offen"),s.t||"offen"); b.appendChild(zt);
  var pa=mk("span","wz-paar"); pa.appendChild(teamKnoten(s));
  var sub=mk("small"); sub.appendChild(mk("span","wz-liga",ligaLabel(D.ligen[s.lk])));
  sub.appendChild(document.createTextNode(" · "+(s.halle||"Halle offen"))); pa.appendChild(sub);
  b.appendChild(pa); b.appendChild(mk("span","wz-erg",ergText(s))); return b;
}
function fuelleWidget(listeId,metaId,spiele,leerText){
  var ziel=leer(document.getElementById(listeId));
  document.getElementById(metaId).textContent = spiele.length?(spiele.length+(spiele.length===1?" Spiel":" Spiele")):"";
  if(!spiele.length){ ziel.appendChild(mk("div","widget-leer",leerText)); return; }
  spiele.forEach(function(s){ ziel.appendChild(widgetZeile(s)); });
}

// Monogramm aus dem Vereinsnamen (Platzhalter bis echte Logos da sind).
function monogramm(name){
  var w=name.replace(/e\.?\s?V\.?/gi,"").trim().split(/[\s\-]+/).filter(Boolean);
  if(w[0] && w[0].length<=4 && w[0]===w[0].toUpperCase()) return w[0];   // ASC, TSG, TVE, SVD ...
  return w.slice(0,3).map(function(x){return x[0];}).join("").toUpperCase();
}

// Team -> {lk, lnr, rohname} aus den Spielen (Team-Id an ht/gt).
function teamInfo(teamId){
  for(var i=0;i<D.spiele.length;i++){ var s=D.spiele[i];
    if(s.sa!==SA) continue;
    if(s.ht===teamId) return {lk:s.lk,lnr:s.lnr,roh:s.h};
    if(s.gt===teamId) return {lk:s.lk,lnr:s.lnr,roh:s.g};
  }
  return null;
}
function tabellenzeile(sa,lnr,roh){
  var tab=D.tabellen[sa+"|"+lnr]; if(!tab) return null;
  for(var i=0;i<tab.length;i++){ if(tab[i].t===roh) return {row:tab[i],anz:tab.length}; }
  return null;
}

function teamsBauen(verein){
  var ziel=leer(document.getElementById("v-teams"));
  var teams=(D.teams||[]).filter(function(t){ return t.sa===SA && t.verein===verein; });
  // Liga-Objekt je Team ermitteln, dann sortieren wie im Kalender.
  teams.forEach(function(t){ var inf=teamInfo(t.id); t._inf=inf; t._li=inf?D.ligen[inf.lk]:null; });
  teams.sort(function(a,b){
    var ja=a._li?sortkeyLiga(a._li):[9,9,9,9,9], jb=b._li?sortkeyLiga(b._li):[9,9,9,9,9];
    for(var i=0;i<ja.length;i++){ if(ja[i]!==jb[i]) return ja[i]-jb[i]; }
    return (a.label||"").localeCompare(b.label||"","de");
  });
  var senioren=teams.filter(function(t){ return !t._li || !t._li.jugend; });
  var jugend=teams.filter(function(t){ return t._li && t._li.jugend; });
  document.getElementById("v-teamzahl").textContent = teams.length+(teams.length===1?" Mannschaft":" Mannschaften");

  function gruppe(titel,arr){
    if(!arr.length) return;
    ziel.appendChild(mk("div","gruppe-titel",titel));
    var grid=mk("div","team-grid");
    arr.forEach(function(t){
      var li=t._li;
      var card=mk("div","team-card"); if(li) card.style.setProperty("--pk",farbe(t._inf.lk));
      card.setAttribute("role","button"); card.tabIndex=0;
      card.addEventListener("click", function(){ teamDetail(t, li); });
      card.addEventListener("keydown", function(e){
        if(e.key==="Enter"||e.key===" "){ e.preventDefault(); teamDetail(t, li); } });
      var lz=mk("div","tc-liga");
      lz.appendChild(mk("span","punkt"));
      lz.appendChild(mk("span","tc-name", li?ligaLabel(li):(t.label||"—")));
      var istPokal = !!(li && (li.ebene||"").indexOf("PK") === 0);
      card.appendChild(lz);
      if(li) card.appendChild(mk("div","tc-sub", ligaChip(li)+" · "+li.name));
      var tab=mk("div","tc-tab");
      if(istPokal){
        var pk=pokalInfo(t);
        tab.className="tc-tab leer";
        if(pk.status==="aus"){
          tab.innerHTML='<span class="tc-status-aus">Ausgeschieden</span>'+
            (pk.runde?' <span class="k">· '+pk.runde+'. Runde</span>':'');
        } else if(pk.status==="offen"){
          tab.textContent=(pk.runde?pk.runde+". Runde: ":"")+pk.spiel.h+" vs "+pk.spiel.g;
        } else if(pk.status==="weiter"){
          tab.textContent="Weiter"+(pk.runde?" · nach "+pk.runde+". Runde":"");
        } else {
          tab.textContent="Pokalrunde";
        }
      } else {
        // Eigene Bilanz der Mannschaft. Die volle Tabelle gibt es erst im Detail
        // (Klick auf die Karte) -- hier steht nur, wie DIESE Mannschaft dasteht.
        var b=teamBilanz(t);
        tab.innerHTML='<span><b>'+b.sp+'</b><span class="k"> Spiele</span></span>'+
          '<span><span class="k">Bilanz </span><b>'+b.s+'</b>–<b>'+b.n+'</b></span>'+
          '<span><b>'+b.p+'</b><span class="k"> Pkt</span></span>'+
          '<span><span class="k">Körbe </span>'+b.k+':'+b.gk+'</span>';
      }
      card.appendChild(tab);
      grid.appendChild(card);
    });
    ziel.appendChild(grid);
  }
  gruppe("Senioren",senioren);
  gruppe("Jugend",jugend);
}

function seiteBauen(verein){
  aktuellerVerein = verein;
  var td=document.getElementById("team-detail"); if(td) td.hidden=true;   // beim Wechsel schliessen
  document.getElementById("v-name").textContent = verein;
  document.getElementById("crest").textContent = monogramm(verein);

  var spiele=D.spiele.filter(function(s){ return s.sa===SA && (s.hv===verein||s.gv===verein); });
  var naechste=spiele.filter(function(s){ return s.d>=HEUTE && !s.e; })
    .sort(function(a,b){ return zeitschluessel(a)<zeitschluessel(b)?-1:1; }).slice(0,5);
  var ergebnisse=spiele.filter(function(s){ return s.e; })
    .sort(function(a,b){ return zeitschluessel(a)>zeitschluessel(b)?-1:1; }).slice(0,5);

  var teams=(D.teams||[]).filter(function(t){ return t.sa===SA && t.verein===verein; });
  var meta=document.getElementById("v-meta");
  meta.innerHTML='<span><b>'+teams.length+'</b> Mannschaften</span>'+
    '<span><b>'+spiele.length+'</b> Spiele '+SA+'</span>'+
    '<span class="platz">@instagram · website — folgt</span>';

  teamsBauen(verein);
  fuelleWidget("w-naechste","m-naechste",naechste,"Keine anstehenden Spiele.");
  fuelleWidget("w-ergebnisse","m-ergebnisse",ergebnisse,"Noch keine Ergebnisse in dieser Saison.");
}

function el(id){ return document.getElementById(id); }
var aktuellerVerein="";

// Rohname -> kanonischer Dortmunder Verein (aus hv/gv der Spiele). Grundlage,
// um andere Dortmunder Teams in der Tabelle zu verlinken. Nicht-Dortmunder Teams
// stehen hier nicht drin und bleiben normaler Text.
var roh2v={};
D.spiele.forEach(function(s){ if(s.hv) roh2v[s.h]=s.hv; if(s.gv) roh2v[s.g]=s.gv; });

// Zu einem anderen Dortmunder Verein springen -- wenn moeglich direkt in dieselbe
// Liga (die Mannschaft, deren Tabelle man gerade ansieht).
function zuVerein(verein, ligaKuerzel){
  if(!verein) return;
  el("v-wahl").value = verein;
  seiteBauen(verein);                     // Uebersicht neu, schliesst offenes Detail
  if(ligaKuerzel){
    var ts=(D.teams||[]).filter(function(t){ return t.sa===SA && t.verein===verein; });
    for(var i=0;i<ts.length;i++){ var inf=teamInfo(ts[i].id);
      if(inf && inf.lk===ligaKuerzel){ ts[i]._inf=inf; ts[i]._li=D.ligen[inf.lk];
        teamDetail(ts[i], ts[i]._li); return; } }
  }
  window.scrollTo({top:0, behavior:"smooth"});
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtd(s){ var d=s2d(s);
  return String(d.getUTCDate()).padStart(2,"0")+"."+String(d.getUTCMonth()+1).padStart(2,"0")+"."; }

// Alle Spiele einer Mannschaft (ueber die Team-Id ht/gt), chronologisch.
function teamSpiele(t){
  return D.spiele.filter(function(s){ return s.sa===SA && (s.ht===t.id || s.gt===t.id); })
    .sort(function(a,b){ return (a.d+(a.t||"99:99")) < (b.d+(b.t||"99:99")) ? -1 : 1; });
}
// Eigene Bilanz einer Mannschaft fuer die Karte: Spiele, Siege, Niederlagen,
// Punkte, Koerbe. Quelle ist die offizielle Tabellenzeile (exakte Punkte je
// nach Ligawertung); fehlt eine Tabelle, aus den eigenen Ergebnissen gezaehlt
// (Punkte dann als 2 je Sieg -- WBV-Standard; greift nur, solange der Verband
// noch keine Tabelle veroeffentlicht hat).
function teamBilanz(t){
  var tz = t._inf ? tabellenzeile(SA, t._inf.lnr, t._inf.roh) : null;
  if(tz){ var r=tz.row; return {sp:r.sp, s:r.s, n:r.n, p:r.p, k:r.k, gk:r.gk}; }
  var sp=0,s=0,n=0,k=0,gk=0;
  teamSpiele(t).forEach(function(g){
    if(!g.e) return;
    var heim=g.ht===t.id, eig=heim?g.e[0]:g.e[1], geg=heim?g.e[1]:g.e[0];
    sp++; k+=eig; gk+=geg; if(eig>geg) s++; else if(eig<geg) n++;
  });
  return {sp:sp, s:s, n:n, p:2*s, k:k, gk:gk};
}
// Pokal-Stand einer Mannschaft: ausgeschieden (erste Niederlage), sonst naechste
// offene Runde, sonst "weiter" nach der letzten gespielten Runde.
function pokalInfo(t){
  var sp=teamSpiele(t).slice().sort(function(a,b){ return (a.rd||0)-(b.rd||0) || (a.d<b.d?-1:1); });
  for(var i=0;i<sp.length;i++){ var s=sp[i];
    if(s.e){ var heim=s.ht===t.id, eig=heim?s.e[0]:s.e[1], geg=heim?s.e[1]:s.e[0];
      if(eig<geg) return {status:"aus", runde:s.rd, spiel:s}; } }
  for(i=0;i<sp.length;i++){ if(!sp[i].e) return {status:"offen", runde:sp[i].rd, spiel:sp[i]}; }
  var last=sp.length?sp[sp.length-1]:null;
  return {status:last?"weiter":"", runde:last?last.rd:null};
}

// Volle Ligatabelle, eigene Mannschaft hervorgehoben. Vor dem 1. Spieltag (alle
// sp=0) Platz/Punkte ausblenden -- die Reihenfolge ist dann nur alphabetisch.
function tabelleBauen(t){
  var wrap=mk("div");
  var tz = t._inf ? D.tabellen[SA+"|"+t._inf.lnr] : null;
  if(!tz || !tz.length){ var lw=mk("div","widget"); lw.appendChild(mk("div","widget-leer","Noch keine Tabelle veröffentlicht.")); wrap.appendChild(lw); return wrap; }
  var gespielt = tz.some(function(r){ return r.sp>0; });
  var lk = t._inf ? t._inf.lk : "";
  var tbl=mk("table","tabelle");
  var thead=mk("thead"); thead.innerHTML='<tr><th class="l">#</th><th class="l">Mannschaft</th><th>Sp</th><th>S</th><th>N</th><th>Pkt</th></tr>';
  tbl.appendChild(thead);
  var tb=mk("tbody");
  tz.forEach(function(r){
    var selbst = t._inf && r.t===t._inf.roh;
    var vk = roh2v[r.t];                       // anderer Dortmunder Verein?
    var tr=mk("tr"); if(selbst) tr.className="ich";
    var zusatz = r.v ? ' <span class="k">(zur.)</span>' : '';
    // Anderer Dortmunder Verein -> Link zu dessen Seite (gleiche Liga). Eigene
    // Zeile und Nicht-Dortmunder bleiben schlichter Text.
    var nameZelle = (vk && !selbst)
      ? '<span class="tlink" role="link" tabindex="0" data-v="'+esc(vk)+'" data-lk="'+esc(lk)+'">'+esc(r.t)+'</span>'+zusatz
      : esc(r.t)+zusatz;
    tr.innerHTML='<td class="l rang">'+(gespielt?r.r:"–")+'</td>'+
      '<td class="l">'+nameZelle+'</td>'+
      '<td>'+r.sp+'</td><td>'+r.s+'</td><td>'+r.n+'</td><td>'+(gespielt?r.p:"–")+'</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); wrap.appendChild(tbl);
  // Delegation: Klick/Enter auf einen verlinkten Verein springt dorthin.
  tbl.addEventListener("click", function(e){
    var a=e.target.closest(".tlink"); if(a) zuVerein(a.dataset.v, a.dataset.lk);
  });
  tbl.addEventListener("keydown", function(e){
    if(e.key!=="Enter" && e.key!==" ") return;
    var a=e.target.closest(".tlink"); if(a){ e.preventDefault(); zuVerein(a.dataset.v, a.dataset.lk); }
  });
  if(!gespielt) wrap.appendChild(mk("div","tab-hinweis","Saison noch offen – Reihenfolge alphabetisch, Platz und Punkte ab dem ersten Spiel."));
  return wrap;
}

// Pokalweg: Runde fuer Runde, verlorene Runde in Rot + "Ausgeschieden".
function pfadBauen(t){
  var sp=teamSpiele(t).slice().sort(function(a,b){ return (a.rd||0)-(b.rd||0) || (a.d<b.d?-1:1); });
  var box=mk("div","pfad");
  if(!sp.length){ box.appendChild(mk("div","widget-leer","Keine Pokalspiele.")); return box; }
  sp.forEach(function(s){
    var heim=s.ht===t.id, verloren=false;
    if(s.e){ var eig=heim?s.e[0]:s.e[1], geg=heim?s.e[1]:s.e[0]; verloren=eig<geg; }
    var r=mk("div","pfad-runde"+(verloren?" aus":"")); r.style.setProperty("--pk",farbe(s.lk));
    r.appendChild(mk("div","r-kopf", s.rd?s.rd+". Runde":"Pokalrunde"));
    var paar=mk("div","r-paar"); paar.appendChild(teamKnoten(s));
    if(s.e){ paar.appendChild(document.createTextNode("  ")); paar.appendChild(mk("span","r-erg", s.e[0]+":"+s.e[1])); }
    else { paar.appendChild(document.createTextNode("  · "+(s.t?s.t+" ":"")+fmtd(s.d))); }
    r.appendChild(paar);
    if(verloren) r.appendChild(mk("div","aus-text","Ausgeschieden"));
    box.appendChild(r);
  });
  return box;
}

// Klick auf eine Mannschaft: links ihre Spiele, rechts Tabelle bzw. Pokalweg.
function teamDetail(t, li){
  el("td-team").textContent = aktuellerVerein;
  el("td-liga").textContent = li ? "· "+ligaLabel(li) : "";
  var sp=teamSpiele(t);
  var w=mk("div","widget"), liste=mk("div","widget-liste");
  if(sp.length) sp.forEach(function(s){ liste.appendChild(widgetZeile(s)); });
  else liste.appendChild(mk("div","widget-leer","Keine Spiele in dieser Saison."));
  w.appendChild(liste); leer(el("td-spiele")).appendChild(w);
  el("td-spiele-label").textContent = "Spiele · "+sp.length+" in "+SA;
  var istPokal=!!(li && (li.ebene||"").indexOf("PK")===0);
  el("td-rechts-label").textContent = istPokal ? "Pokalweg" : "Tabelle";
  leer(el("td-rechts")).appendChild(istPokal ? pfadBauen(t) : tabelleBauen(t));
  el("team-detail").hidden=false;
  el("team-detail").scrollIntoView({behavior:"smooth", block:"start"});
}
el("td-back").addEventListener("click", function(){
  el("team-detail").hidden=true;
  el("v-teams").scrollIntoView({behavior:"smooth", block:"start"});
});

// Vereins-Umschalter
(function(){
  var sel=document.getElementById("v-wahl");
  var namen=D.vereine.map(function(v){return v.name;}).sort(function(a,b){return a.localeCompare(b,"de");});
  namen.forEach(function(n){ var o=mk("option",null,n); o.value=n; sel.appendChild(o); });
  var start = namen.indexOf("TSG Dortmund-Schüren")>=0 ? "TSG Dortmund-Schüren" : namen[0];
  sel.value=start;
  sel.addEventListener("change",function(){ seiteBauen(sel.value); });
  seiteBauen(start);
})();

document.getElementById("fuss").textContent =
  "Muster-Vereinsseite · Daten "+SA+" · Stand "+HEUTE+" · Vereinslogos folgen (Platzhalter-Monogramm)";
</script>
